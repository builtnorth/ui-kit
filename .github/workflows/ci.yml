name: CI

on:
    pull_request:
        branches:
            - main
    workflow_dispatch:

jobs:
    ci:
        uses: builtnorth/.github/.github/workflows/npm-package-ci.yml@main
        with:
            package-name: "ui-kit"
            # Skip tests, lint, and build since this is a pure SCSS package
            run-tests: false
            run-lint: false
            run-build: false
            use-workspace: false
        secrets: inherit
